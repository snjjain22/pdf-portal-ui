[phases.setup]
nixPkgs = ["gcc", "ninja", "git", "libGL", "glib"]

[phases.install]
cmds = [
  "pip install 'numpy<2'",
  "pip install torch==2.2.2+cpu torchvision==0.17.2+cpu --index-url https://download.pytorch.org/whl/cpu",
  "pip install transformers==4.44.2 tokenizers==0.19.1 huggingface-hub==0.24.7",
  "pip install groundingdino-py segment-anything",
  "pip install -r prompt_based_PDF_extractor/requirements.txt",
  "pip install -r pdf_portal/requirements.txt",
  "pip install transformers==4.44.2 tokenizers==0.19.1 huggingface-hub==0.24.7 --force-reinstall --no-deps",
  "pip install torch==2.2.2+cpu torchvision==0.17.2+cpu --index-url https://download.pytorch.org/whl/cpu --force-reinstall --no-deps",
]

[start]
cmd = "bash start.sh"
