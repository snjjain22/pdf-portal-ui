[phases.setup]
nixPkgs = ["gcc", "ninja", "git", "libGL", "glib"]

[phases.install]
cmds = [
  "pip install 'numpy<2'",
  "pip install torch==2.2.2+cpu torchvision==0.17.2+cpu --index-url https://download.pytorch.org/whl/cpu",
  "pip install transformers==4.44.2 tokenizers==0.19.1 huggingface-hub==0.24.7",
  "pip install --no-deps groundingdino-py segment-anything",
  "pip install --no-deps addict yapf timm supervision pycocotools",
  "pip install -c constraints.txt -r prompt_based_PDF_extractor/requirements.txt",
  "pip install -c constraints.txt -r pdf_portal/requirements.txt",
  "python -c 'import torch; import transformers; print(f\"torch={torch.__version__}\"); print(f\"transformers={transformers.__version__}\")'",
]

[start]
cmd = "bash start.sh"
